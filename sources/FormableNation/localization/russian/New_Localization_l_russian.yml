 MGB-unification-event-flavor:0 "С объединением западных мусульман мы должны выбрать, на чем сосредоточить наше внимание. Мы можем сосредоточиться на севере и контролировать Средиземноморье. Или же мы можем сосредоточиться на юге и продвинуться дальше в Африку".
 MGB-unification-option-01:0 "Новая сила в Средиземноморье".
 MGB-unification-option-02:0 "Мы будем контролировать всю Западную Африку".
 MGB-unification-journal_reason:0 "Формирование Магриба"
 
#BSA
 BSA:0 "Балтоскандия"
 BSA_ADJ:0 "Балтоскандия"
 BSA_FLAVOR_TEXT:0 "Народы Северной Европы объединились, чтобы противостоять внешним угрозам своему существованию. Они вместе встретятся с миром, но как мир отреагирует на это?"

