 ICE-unification-option-01:0 "Нет, мы покажем им, как мы можем работать вместе".
 ICE-unification-option-02:0 "Да, мы отомстим колонизаторам!"
 ICE-culture-warning:0 "ВНИМАНИЕ! СЕРЬЕЗНЫЕ ИЗМЕНЕНИЯ В КУЛЬТУРЕ"
 ICE-unification-journal_reason:0 "Формирование империи инков"
 
