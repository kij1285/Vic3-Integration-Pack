je_bnl_religion:0 "Вопрос религии"
je_bnl_religion_reason:0 "В прошлом мы были едины, но быстро возникали конфликты из-за религии. Эти вопросы должны быть решены, ибо до тех пор мы не станем по-настоящему единой нацией. "
je_bnl_religion_goal: "Менее 25 % беспорядков в #tooltippable #tooltip:bnl_core #bold core#!#!#! [SCOPE.GetRootScope.GetCountry.GetName] регионах в течение 10 лет".
