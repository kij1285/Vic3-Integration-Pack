BNL-religion-event-title:0 "Худшие конфликты позади"
BNL-religion-event-description:0 "Религиозные конфликты сведены к минимуму".
BNL-religion-event-flavor:0 "Протестантский север и католический юг долгое время противостояли друг другу. Но благодаря кропотливой работе большинство конфликтов утихло. Сможет ли нация когда-нибудь по-настоящему двигаться дальше?"
BNL-religion-option-01:0 "Объединенные под разными религиями"
BNL-religion-modifier-01:0 "Уменьшение религиозных конфликтов"

je_bnl_trade_or_industry:0 "Торговля или промышленность?"
je_bnl_trade_or_industry_reason: "Последние 200 лет север нашей страны был сосредоточен на торговле, но юг был промышленным центром со средних веков.\n\nКакую из этих идентичностей мы будем использовать, чтобы продвинуть нас в новую эпоху? Мы можем выбрать только одну, поэтому мы должны выбирать тщательно".
bnl_trade_or_industry_industry:0 "Мы сосредоточились на промышленности"
bnl_trade_or_industry_trade:0 "Мы сосредоточились на торговле"

je_bnl_industry: "В центре внимания: промышленность"
je_bnl_industry_reason:0 "Промышленность - это то, что позволяет таким странам, как Британия и Франция, развиваться и становиться настоящими великими державами. Мы должны последовать этому примеру и позволить нашей промышленности продвинуть нас в следующую эру."
je_bnl_industry_goal:0 "Завершить все промышленные политики".
je_bnl_industry_1: "Промышленная политика: Внутреннее производство"
je_bnl_industry_1_reason:0 "Чтобы поднять местную промышленность, мы должны стать в основном самодостаточными по двум важнейшим товарам этой эпохи - железу и углю."
je_bnl_industry_2: "Промышленная политика: Экономический рост"
je_bnl_industry_2_reason:0 "Чтобы конкурировать с другими великими державами, мы должны поддерживать определенный уровень роста, чтобы обеспечить себе место за столом переговоров. "
je_bnl_industry_3: "Промышленная политика: Защитить нашу промышленность"
je_bnl_industry_3_reason:0 "Мы не можем допустить, чтобы другие страны продавали нам всю свою продукцию по более низким ценам. Это приведет к сокращению нашей собственной промышленности, поэтому мы должны создать защитные механизмы".

je_bnl_trade: "Фокус: Торговля"
je_bnl_trade_reason:0 "Мир становится все более и более глобальным, и торговля способствует этому. Если мы станем пионерами этого движения, то сможем опередить его и получить прибыль."
je_bnl_trade_goal:0 "Завершить все торговые политики".

bnl_industry_complete:0 "Прогресс на пути развития промышленности".
bnl_trade_complete:0 "Прогресс на пути торговли".

je_bnl_trade_1: "Торговая политика: Торговые суда"
je_bnl_trade_1_reason:0 "Для ведения мировой торговли нам нужно достаточно судов, чтобы выдержать этот возросший объем".
je_bnl_trade_2: "Торговая политика: Торговые мощности"
je_bnl_trade_2_reason:0 "Управление торговлей и сбор прибыли требуют времени и людей, поэтому мы должны обеспечить необходимую инфраструктуру для этого."
je_bnl_trade_3: "Торговая политика: Свободная торговля"
je_bnl_trade_3_reason:0 "Свобода глобализованной торговли - это будущее. Наши законы должны быть готовы к этому новому миру. "

BNL-industry-event-title:0 "Промышленная держава"
BNL-industry-event-description:0 "Мы выбрали путь массовой индустриализации".
BNL-industry-event-flavor:0 "Шум промышленности и звуки огромных паровых машин. Это слышно по всей стране, это потребовало много времени и усилий, но мы можем причислить себя к промышленным державам мира."
BNL-industry-option-01:0 "Тост за мощь парового двигателя"
BNL-industry-modifier-01:0 "Тяжелая промышленность - это будущее"

BNL-trade-event-title:0 "Первый центр мировой торговли"
BNL-trade-event-description:0 "Мы выбрали путь глобальной торговли".
BNL-trade-event-flavor:0 "Наши корабли достигают всех уголков мира, от холодных пустошей Сибири до шумных портов Лондона и Нью-Йорка. Наш логотип знают в каждом доме, ведь большинство товаров хотя бы раз проходят через наши порты. "
BNL-trade-option-01:0 "Никто нас не свалит"
BNL-trade-modifier-01:0 "Бесконечная торговля"

#Малайские решения
trade_malay_for_subject:0 "Войдите в британскую сферу"
trade_malay_for_subject_desc:0 "Британия владеет несколькими портами и регионами на нашей границе. Если мы примем их в качестве владыки, они, возможно, будут склонны отдать их нам."

#USE Journals
je_forming_USE:0 "Формирование Соединенных Штатов Европы"
je_forming_USE_custom_complete:0 "Выбор продолжения или увольнения Соединенных Штатов Европы"
je_button_dismiss_USE:0 "Отказаться от идеи"
je_button_dismiss_USE_desc:0 "Идея создания Соединенных Штатов Европы будет отклонена".
je_button_pursue_USE:0 "Продолжить идею"
je_button_pursue_USE_desc:0 "Мы будем преследовать идею создания больших Соединенных Штатов Европы".
je_forming_USE_reason:0 "Идея создания Соединенных Штатов Европы набирает обороты, и мы должны решить, хотим ли мы продолжать ее реализовывать".
je_button_dismiss_USE_custom:0 "Мы НЕ увидим нового контента о создании Соединенных Штатов Европы. (ПРИМЕЧАНИЕ: Это нельзя отменить!)".
je_button_pursue_USE_custom:0 "Мы увидим новый контент о формировании Соединенных Штатов Европы".
USE_formation.1-title:0 "Первые шаги на пути к ЕГЭ"
USE_formation.1-description:0 "Как мы будем работать над достижением нашей цели?"
USE_formation.1-flavor:0 "Взяв на себя обязательство создать Соединенные Штаты Европы, мы должны выбрать, как мы начнем этот процесс? Мы можем сделать это с помощью меча, заявив, что определенные страны должны стать частью Союза. Или же мы можем попытаться дипломатическим путем убедить другие страны в том, что наш путь вперед будет наилучшим для всех."
USE-formation-type-aggressive-option-01:0 "Европа падет перед нашими ногами!"
USE-formation-type-diplomatic-option-01:0 "Мы убедим Европу в правильности нашего пути".
USE-formation-type-aggressive-option-01-custom:0 "Мы будем претендовать на части Европы и силой оружия включим их в состав USE".
USE-formation-type-diplomatic-option-01-custom:0 "Мы будем использовать наше влияние и дипломатию, чтобы убедить другие страны присоединиться к USE".
je_forming_USE_diplo:0 "Формирование СШЕ: Дипломатия"
je_forming_USE_diplo_reason:0 "Большое европейское государство - это то, что набирает обороты в последние несколько лет. Теперь у нас есть возможность убедить другие страны присоединиться к идее большой Европы."

#Diplomatic Buttons
je_button_pursue_USE_diplo_NL:0 "Пригласить Нидерланды в СШЕ"
je_button_pursue_USE_diplo_NL_desc:0 "Приглашение, безусловно, будет стоить нам дорого, мы должны быть готовы".
je_button_pursue_USE_diplo_BE:0 "Пригласить Бельгию в СШЕ"
