 HRE-unification-event-description:0 "Возрождение двуглавого орла".
 HRE-unification-event-flavor:0 "Почти тысячелетие Священная Римская империя росла и падала, а последний удар нанес Наполеон. Эта ошибка наконец-то исправлена, и все народы империи станут сильнее вместе. Будущее обещает быть благоприятным для всех нас".
 HRE-unification-option-01:0 "Рождение европейской сверхдержавы".
 HRE-unification-journal_reason:0 "Формирование Священной Римской империи"

#Benelux
 BNL:0 "Бенилюкс"
 BNL_ADJ:0 "Бенилюкс"
 BNL_FLAVOR_TEXT:0 "Он может показаться маленьким, но у Бенилюкса есть шанс стать крупным игроком в Европе. Все, что для этого нужно, - воспользоваться им. "

 BNL-formation-modifier-01:0 "Загнанная в угол между великими державами"
  
 BNL-unification-journal:0 "Объединенные низины"
 BNL-unification-journal-complete:0 "Это Бенилюкс"
 
