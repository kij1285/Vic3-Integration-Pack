 BNL-unification-event-description:0 "Новый лев рычит".
 BNL-unification-event-flavor:0 "Низины наконец-то снова вместе после того, как их насильно растащили. Очевидно, что вместе мы сильнее, но мы молоды и окружены. Чтобы выстоять под натиском врагов, необходимо найти союзы и сокрушить соперников. "
 BNL-unification-option-01:0 "Как мы будем конкурировать с другими крупными державами в Европе?"
 BNL-unification-journal_reason:0 "Формирование Бенилюкса"

#UCB
 UCB:0 "Объединенные Карибы"
 UCB_ADJ:0 "Объединенные Карибы"
 UCB_FLAVOR_TEXT:0 "Объединенные Карибы, все острова которых находятся под одним флагом, ожидает непростое будущее. Он окружен великими державами, которые более чем готовы установить над ним контроль. "

 UCB-formation-modifier-01:0 "Современное пиратское королевство"
  
 UCB-unification-journal:0 "Объединение Карибского бассейна"
 UCB-unification-journal-complete:0 "Объединенные Карибы"
 
 UCB-unification-event-title:0 "Карибы под одним флагом"
 UCB-unification-event-description:0 "Начался второй золотой век пиратства".
 UCB-unification-event-flavor:0 "Веками Карибский бассейн находился под контролем чужаков, но не более! Мы владеем одними из старейших пиратских столиц в мире, и они снова станут нашими. Мы откроем новую эру пиратства! "
 UCB-unification-option-01:0 "Стройте верфи и обучайте моряков!"
 UCB-unification-journal_reason:0 "Формирование Объединенных Карибских островов"

#IFR
 IFR:0 "Имперская Федерация"
 IFR_ADJ:0 "Имперская Федерация"
 IFR_FLAVOR_TEXT:0 "Глобальная федеральная империя, первая в своем роде. Она обладает огромной властью, но это влечет за собой множество проблем и сфер контроля. Сможет ли империя удержаться вместе и по-настоящему править волнами. "

 IFR-formation-modifier-01:0 "Глобальная федеральная империя"
  
 IFR-unification-journal:0 "Глобальная империя"
 IFR-unification-journal-complete:0 "Имперская федерация"
 
 IFR-unification-event-title:0 "Вся Империя под одним флагом"
 IFR-unification-event-description:0 "Началась новая эра дипломатии".
 IFR-unification-event-flavor:0 "Чем больше росла империя, тем сложнее было ее контролировать. Теперь все страны империи находятся в одном парламенте. Вместе мы объединим всех под одной личностью и страной. "
 IFR-unification-option-01:0 "Нам придется расширить палату общин!"
 IFR-unification-journal_reason:0 "Формирование Имперской Федерации"

#INC
 INC:0 "Индокитай"
 INC_ADJ:0 "Индокитай"
 INC_FLAVOR_TEXT:0 "Народы Индокитая долгое время воевали друг с другом, но это время прошло. Объединившись, мы встретимся с миром и его невзгодами".

 INC-formation-modifier-01:0 "Разнообразная страна"
  
 INC-unification-journal:0 "Новая держава в Азии"
 INC-unification-journal-complete:0 "Это Индокитай"
 
 INC-unification-event-title:0 "Выступим против наших угнетателей"
 INC-unification-event-description:0 "Впереди трудный путь".
 INC-unification-event-flavor:0 "Слишком долго страны Индокитая подвергались издевательствам и репрессиям со стороны более крупных держав за пределами полуострова. Несмотря на наши различия, нам придется работать вместе, чтобы противостоять внешним опасностям. "
 INC-unification-option-01:0 "Смогут ли наши культуры работать вместе?"
 INC-unification-journal_reason:0 "Формирование Индокитая"

#TCC
 TCC:0 "Кавказ"
 TCC_ADJ:0 "Кавказ"
 TCC_FLAVOR_TEXT:0 "Народы Кавказа долгое время угнетались русским народом, но не более! Они объединились, чтобы противостоять своему последнему врагу в это смутное время. "

 TCC-formation-modifier-01:0 "Готовы к бою"
  
 TCC-unification-journal:0 "Кавказ един"
 TCC-unification-journal-complete:0 "Это Кавказ"
 
 TCC-unification-event-title:0 "Перед лицом последнего врага"
 TCC-unification-event-description:0 "Русские больше не будут нас покорять".
 TCC-unification-event-flavor:0 "Долгие годы народы Кавказа были подвластны многим другим группам, главными из которых были русские. Мы больше не будем прогибаться, мы будем готовиться к их вторжению. Потому что мы знаем, что оно придет. "
 TCC-unification-option-01:0 "Объединившись, мы будем достаточно сильны, чтобы противостоять любой угрозе. "
 TCC-unification-journal_reason:0 "Формирование Кавказа"
 
#RME
 RME:0 "Римская империя"
 RME_ADJ:0 "Римская империя"
 RME_FLAVOR_TEXT:0 "Римская империя просуществовала более тысячи лет... и под нашим новым руководством она просуществует еще тысячу. Но все же мы не должны недооценивать изменения этого нового индустриального мира. "

 RME-formation-modifier-01:0 "Во славу Рима"
  
 RME-unification-journal:0 "Возрождение империи"
 RME-unification-journal-complete:0 "Является ли Римская империя"
 
 RME-unification-event-title:0 "Орел снова поднимается"
 RME-unification-event-description:0 "То, что было когда-то потеряно, снова найдено"
 RME-unification-event-flavor:0 "Более 1500 лет назад Рим был разрушен нашей неэффективной бюрократией и германскими народами. Возродив империю, мы будем учиться на своих ошибках и отомстим!"
 RME-unification-option-01:0 "Эти северные варвары получат по заслугам!"
 RME-unification-journal_reason:0 "Формирование Римской империи"
 
#MGB
