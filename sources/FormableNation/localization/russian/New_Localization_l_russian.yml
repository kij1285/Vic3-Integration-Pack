 HRE_FLAVOR_TEXT:0 "Эта империя могущественна, обширна и разнообразна, сможет ли она держаться вместе и править континентом, как это было в прошлые века?"

 HRE-formation-modifier-01:0 "В сердце Европы"
  
 HRE-unification-journal:0 "Империя возрождается"
 HRE-unification-journal-complete:0 "Является ли Священная Римская империя"
 
