je_formation_of_the_roman_empire:0 "Становление Римской империи"
je_formation_of_the_roman_empire_reason:0 "Реформирование наших потерянных земель будет долгим и трудным путешествием. Мы можем официально заявить о своих правах на эти территории, чтобы они помогли нам в завоевании, но окружающие народы могут воспротивиться этим действиям."

je_button_rome_iberia:0 "Заявить права на Иберию"
je_button_rome_iberia_desc:0 "Пиренейский полуостров долгое время находился под властью Рима и до сих пор является нашим латинским братом. Они должны принять свою интеграцию".
je_button_rome_iberia_claim_states:0 "Получить права на все государства в Иберии"
claimed_iberia:0 "Претендую на Иберию"

je_button_rome_gaul:0 "Предъявить претензии на Галлию"
je_button_rome_gaul_desc:0 "Юлий Цезарь первоначально завоевал Галлию для республики, настало время, чтобы они снова присоединились к Риму".
je_button_rome_gaul_claim_states:0 "Получите права на все государства в Галлии"
claimed_gaul:0 "Притязания на Галлию"

je_button_rome_north_africa:0 "Предъявить претензии на Северную Африку"
je_button_rome_north_africa_desc:0 "Земли Карфагена и Египта, некогда бывшие житницей нашей империи, снова найдут свое применение."
je_button_rome_north_africa_claim_states:0 "Получить права на все государства в Северной Африке"
claimed_north_africa:0 "Притязания на Северную Африку"

je_button_rome_byzantium:0 "Предъявить претензии на Византию"
je_button_rome_byzantium_desc:0 "Византия оставалась сильной долгое время после падения Рима. Они должны быть восстановлены, чтобы претендовать на престиж этого исторического акта".
je_button_rome_byzantium_claim_states:0 "Получите права на все греческие государства Византии"
claimed_byzantium:0 "Претензии к Византии"

je_button_rome_levant:0 "Претендовать на Левант"
je_button_rome_levant_desc:0 "Наша важнейшая сухопутная связь между северной и южной частями Средиземноморья должна быть надежно защищена".
je_button_rome_levant_claim_states:0 "Получить права на все государства в Леванте"
claimed_levant:0 "Претендую на Левант"

je_button_rome_balkans:0 "Предъявить претензии на Балканы"
je_button_rome_balkans_desc:0 "Балканы были важной буферной зоной для наших сердечных земель. Мы должны вернуть их себе".
je_button_rome_balkans_claim_states:0 "Получите права на все государства на Балканах"
claimed_balkans:0 "Претендую на Балканы"

je_button_rome_britain:0 "Предъявить претензии к Британии"
je_button_rome_britain_desc:0 "В прошлом они были дорогой экспедицией, но сегодня это промышленный центр. Британия снова будет нашей".
je_button_rome_britain_claim_states:0 "Получите права на все государства на юге Британии"
claimed_britain:0 "Претендую на Британию"

je_button_rome_germania:0 "Претендовать на Германию"
je_button_rome_germania_desc:0 "В прошлом земли к северу от нас были заселены германскими племенами, но сейчас они являются частью земли под названием Германия. Это наша последняя граница, на которую мы можем претендовать".
je_button_rome_germania_claim_states:0 "Получите права на все государства в старой римской Германии"
claimed_germania:0 "Притязания на Германию"

integrate_magrebi_into_rome:0 "Интегрировать Магриби"
integrate_magrebi_into_rome_desc:0 "За века, прошедшие после падения Рима, североафриканцы все больше отдалялись от нас. Мы должны приложить усилия, чтобы интегрировать их в империю. "
RME_magrebi_integration-title:0 "Интеграция магрибцев"
RME_magrebi_integration-description:0 "Необходимо приложить новые усилия, чтобы североафриканцы приняли наше правление".
RME_magrebi_integration-flavor:0 "Североафриканцы далеко отошли от исконной римской культуры, но они являются важной частью империи. Необходимо внести некоторые изменения".
RME_magrebi_integration-option-01:0 "Наши бюрократы приложат все усилия, чтобы изменить законы".
RME_magrebi_integration-option-02:0 "Вложим огромные средства в магрибские земли"
RME_magrebi_integration-option-03:0 "Мы не заинтересованы"
maghrebi_integration_efforts_1:0 "Интеграция Магриби"
maghrebi_integration_efforts_2:0 "Интеграция Магриби"

