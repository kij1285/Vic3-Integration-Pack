BNL-religion-event-title:0 "Die Schlimmsten Konflikte Sind Vorbei"
BNL-religion-event-description:0 "Religiöse Konflikte werden auf ein Minimum reduziert."
BNL-religion-event-flavor:0 "Der protestantische Norden und der katholische Süden standen sich lange Zeit feindlich gegenüber. Aber durch fleißige Arbeit haben sich die meisten Konflikte gelegt. Kann sich die Nation jemals wirklich weiterentwickeln?"
BNL-religion-option-01:0 "Unified Under Different Religions"
BNL-religion-modifier-01:0 "Reduced Religous Conflicts"

je_bnl_trade_or_industry:0 "Trade or Industry Focus?"
je_bnl_trade_or_industry_reason: "The north of our country has focussed on trade for the past 200 years, but our south has been an industrial powerhouse since the middle ages.\n\nWhich of these identities will we pursue to boost us into this new age? We can only choose one so we must choose carefully."
bnl_trade_or_industry_industry:0 "Wir haben uns auf die Industrie konzentriert"
bnl_trade_or_industry_trade:0 "Wir haben uns auf den Handel konzentriert"

je_bnl_industry: "Schwerpunkt: Industrie"
je_bnl_industry_reason:0 "Die Industrie ist es, die es Ländern wie Großbritannien und Frankreich ermöglicht, zu wachsen und echte Großmächte zu werden. Wir müssen diesem Beispiel folgen und unserer Industrie erlauben, uns in die nächste Ära zu führen."
je_bnl_industry_goal:0 "Vervollständigen Sie alle industriepolitischen Maßnahmen."
je_bnl_industry_1: "Industriepolitik: Inländische Produktion"
je_bnl_industry_1_reason:0 "Um unsere lokale Industrie anzukurbeln, müssen wir bei den beiden wichtigsten Gütern dieser Zeit, Eisen und Kohle, weitgehend autark werden."
je_bnl_industry_2: "Industriepolitik: Wirtschaftliches Wachstum"
je_bnl_industry_2_reason:0 "Um mit den anderen Großmächten konkurrieren zu können, müssen wir ein gewisses Wachstum aufrechterhalten, um uns einen Platz am Verhandlungstisch zu sichern. "
je_bnl_industry_3: "Industriepolitik: Schützt unsere Industrie"
je_bnl_industry_3_reason:0 "Wir können nicht zulassen, dass andere Länder ihre gesamte Ware zu einem niedrigeren Preis an uns verkaufen. Das wird unsere eigene Industrie untergraben, wir müssen Schutzmaßnahmen ergreifen."

je_bnl_trade: "Schwerpunkt: Handel"
je_bnl_trade_reason:0 "Die Welt wird immer globaler und der Handel erleichtert dies. Wenn wir zu den Pionieren dieser Bewegung gehören, können wir der Zeit voraus sein und davon profitieren."
je_bnl_trade_goal:0 "Schließen Sie alle Handelspolitiken ab."

bnl_industry_complete:0 "Fortschritte auf dem Weg der Industrie"
bnl_trade_complete:0 "Fortschritte auf dem Weg des Handels"

je_bnl_trade_1: "Handelspolitik: Handelsschiffe"
je_bnl_trade_1_reason:0 "Für den Welthandel brauchen wir genügend Schiffe, um dieses erhöhte Volumen zu bewältigen."
je_bnl_trade_2: "Handelspolitik: Handelskapazität"
je_bnl_trade_2_reason:0 "Die Verwaltung des Handels und die Erzielung von Gewinnen erfordert Zeit und Menschen, und wir müssen sicherstellen, dass wir über die erforderliche Infrastruktur verfügen, um dies zu ermöglichen."
je_bnl_trade_3: "Handelspolitik: Freihandel"
je_bnl_trade_3_reason:0 "Die Freiheit des globalen Handels ist die Zukunft. Unsere Gesetze müssen auf diese neue Welt vorbereitet sein. "

BNL-industry-event-title:0 "Ein Industrielles Kraftzentrum"
BNL-industry-event-description:0 "Wir haben uns für den Weg der Massenindustrialisierung entschieden."
BNL-industry-event-flavor:0 "Das geschäftige Treiben der Industrie und die Geräusche der gewaltigen Dampfmaschinen. Dies ist im ganzen Land zu hören. Es hat viel Zeit und Mühe gekostet, aber wir können uns zu den industriellen Kraftzentren der Welt zählen."
BNL-industry-option-01:0 "Ein Toast auf die Kraft der Dampfmaschine"
BNL-industry-modifier-01:0 "Die Schwerindustrie ist die Zukunft"

BNL-trade-event-title:0 "Das Erste Zentrum Des Welthandels"
BNL-trade-event-description:0 "Wir haben den Weg des globalen Handels gewählt."
BNL-trade-event-flavor:0 "Unsere Schiffe erreichen jeden Winkel der Welt, von den kalten Einöden Sibiriens bis zu den geschäftigen Häfen von London und New York. Unser Logo ist in jedem Haushalt bekannt, da die meisten Produkte mindestens einmal unsere Häfen durchlaufen. "
BNL-trade-option-01:0 "Niemand wird uns zu Fall bringen"
BNL-trade-modifier-01:0 "Unendlicher Handel"

#Malay Decisions
trade_malay_for_subject:0 "Betreten Sie die britische Sphäre"
trade_malay_for_subject_desc:0 "Britannien besitzt mehrere Häfen und Regionen an unserer Grenze. Wenn wir sie als Oberherrn akzeptieren würden, wären sie vielleicht bereit, sie uns zu überlassen."

#USE Journals
je_forming_USE:0 "Die Gründung der Vereinigten Staaten von Europa"
je_forming_USE_custom_complete:0 "Entscheidung für oder gegen die Vereinigten Staaten von Europa"
je_button_dismiss_USE:0 "Verwerfen Sie die Idee"
je_button_dismiss_USE_desc:0 "Die Idee, die Vereinigten Staaten von Europa zu gründen, wird verworfen werden."
je_button_pursue_USE:0 "Verfolgen Sie die Idee"
je_button_pursue_USE_desc:0 "Wir werden die Idee der Bildung einer größeren Vereinigten Staaten von Europa verfolgen."
je_forming_USE_reason:0 "Der Gedanke, die Vereinigten Staaten von Europa zu gründen, hat an Zugkraft gewonnen, und wir sollten entscheiden, ob wir diesen Gedanken weiterverfolgen wollen."
je_button_dismiss_USE_custom:0 "Wir werden KEINE neuen Inhalte zur Gründung der Vereinigten Staaten von Europa sehen. (HINWEIS: Dies kann nicht rückgängig gemacht werden!)"
je_button_pursue_USE_custom:0 "Wir WERDEN neue Inhalte über die Gründung der Vereinigten Staaten von Europa sehen."
USE_formation.1-title:0 "Erste Schritte auf dem Weg zum VSE"
USE_formation.1-description:0 "Wie werden wir auf unser Ziel hinarbeiten?"
USE_formation.1-flavor:0 "Mit unserer Verpflichtung, die Vereinigten Staaten von Europa zu gründen, müssen wir entscheiden, wie wir diesen Prozess beginnen wollen. Wir können es mit dem Schwert tun und fordern, dass bestimmte Länder Teil der Union werden sollten. Oder wir können versuchen, andere Nationen auf diplomatischem Wege davon zu überzeugen, dass unser Weg der beste für alle ist."
USE-formation-type-aggressive-option-01:0 "Europa wird vor unseren Füßen fallen!"
USE-formation-type-diplomatic-option-01:0 "Wir werden Europa von unserem Weg überzeugen."
USE-formation-type-aggressive-option-01-custom:0 "Wir werden Teile Europas für uns beanspruchen und sie mit Waffengewalt in die USE eingliedern."
USE-formation-type-diplomatic-option-01-custom:0 "Wir werden unseren Einfluss und unsere Diplomatie nutzen, um andere Nationen zu überzeugen, sich der USE anzuschließen."
je_forming_USE_diplo:0 "Die Gründung des VSE: Diplomatisch"
je_forming_USE_diplo_reason:0 "Ein größerer europäischer Staat ist etwas, das in den letzten Jahren immer mehr an Bedeutung gewonnen hat. Wir haben jetzt die Möglichkeit, andere Nationen davon zu überzeugen, sich der Idee eines größeren Europas anzuschließen."

