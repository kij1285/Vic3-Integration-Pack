l_german:
je_formable_nations_plus: "Formable Nations Plus"
#HRE
 HRE:0 "Heiliges Römisches Reich"
 HRE_ADJ:0 "Das Heiliges Römisches Reich"
 HRE_FLAVOR_TEXT:0 "Dieses Reich ist mächtig, groß und vielfältig. Wird es in der Lage sein, zusammenzubleiben und den Kontinent wie in vergangenen Zeiten zu beherrschen?"

 HRE-formation-modifier-01:0 "Im Herzen Von Europa"
  
 HRE-unification-journal:0 "Ein Wiedergeborenes Reich"
 HRE-unification-journal-complete:0 "Ist Das Heiliges Römisches Reich"
 
 HRE-unification-event-title:0 "Das Wiedergeborene Heilige Römische Reich"
 HRE-unification-event-description:0 "Die Wiedergeburt des Doppelkopfadlers."
 HRE-unification-event-flavor:0 "Fast ein Jahrtausend lang wuchs und fiel das Heilige Römische Reich, bis Napoleon ihm den Todesstoß versetzte. Dieser Fehler ist nun endlich korrigiert worden, und alle Völker dieses Reiches werden gemeinsam stärker sein. Die Zukunft sieht für uns alle günstig aus."
 HRE-unification-option-01:0 "Die Geburt einer europäischen Supermacht."
 HRE-unification-journal_reason:0 "Die Gründung des Heiligen Römischen Reiches"

#Benelux
 BNL:0 "Benelux"
 BNL_ADJ:0 "Benelux"
 BNL_FLAVOR_TEXT:0 "Es mag klein erscheinen, aber die Benelux haben die Chance, ein großer Akteur in Europa zu werden. Sie müssen sie nur ergreifen. "

 BNL-formation-modifier-01:0 "In die Enge getrieben zwischen Großmächten"
  
 BNL-unification-journal:0 "Die Vereinigten Niederungen"
 BNL-unification-journal-complete:0 "Ist Die Benelux"
 
 BNL-unification-event-title:0 "Die Benelux Endlich Wiedervereint"
 BNL-unification-event-description:0 "Der neue Löwe brüllt."
 BNL-unification-event-flavor:0 "Das Flachland ist endlich wieder vereint, nachdem es gewaltsam auseinandergerissen wurde. Es ist klar, dass wir gemeinsam stärker sind, aber wir sind jung und umzingelt. Wir müssen Allianzen finden und Rivalen vernichten, wenn wir den kommenden Ansturm überleben wollen. "
 BNL-unification-option-01:0 "Wie werden wir mit den anderen Großmächten in Europa konkurrieren?"
 BNL-unification-journal_reason:0 "Die Gründung der Benelux"

#UCB
 UCB:0 "Vereinigte Karibik"
 UCB_ADJ:0 "Vereinigte Karibik"
 UCB_FLAVOR_TEXT:0 "Mit all ihren Inseln unter einer Flagge steht die Vereinigte Karibik vor einer schwierigen Zukunft. Sie ist von Großmächten umgeben, die mehr als bereit sind, die Kontrolle über sie auszuüben. "

 UCB-formation-modifier-01:0 "Ein Modernes Piratenkönigreich"
  
 UCB-unification-journal:0 "Vereinheitlichung Der Karibik"
 UCB-unification-journal-complete:0 "Ist Die Vereinigte Karibik"
 
 UCB-unification-event-title:0 "Die Karibik Unter Einer Flagge"
 UCB-unification-event-description:0 "Das zweite goldene Zeitalter der Piraterie hat begonnen."
 UCB-unification-event-flavor:0 "Die Karibik war jahrhundertelang unter der Kontrolle von Außenseitern, nicht länger! Wir halten einige der ältesten Piratenhauptstädte der Welt, und sie sollen es wieder werden. Wir leiten ein neues Zeitalter der Piraterie ein! "
 UCB-unification-option-01:0 "Baut die Werften und bildet die Seeleute aus!"
 UCB-unification-journal_reason:0 "Die Gründung der Vereinigten Karibik"

#IFR
 IFR:0 "Kaiserliche Föderation"
 IFR_ADJ:0 "Kaiserliche Föderation"
 IFR_FLAVOR_TEXT:0 "Ein globales föderales Imperium, das erste seiner Art. Es hat viel Macht, aber das bringt auch viele Probleme und Kontrollbereiche mit sich. Kann das Imperium zusammenbleiben und wirklich die Wellen beherrschen? "

 IFR-formation-modifier-01:0 "Ein Globales Föderales Imperium"
  
 IFR-unification-journal:0 "Ein Globales Imperium"
 IFR-unification-journal-complete:0 "Ist Die Imperiale Föderation"
 
 IFR-unification-event-title:0 "Das Ganze Reich Unter Einer Flagge"
 IFR-unification-event-description:0 "Ein neues Zeitalter der Diplomatie hat begonnen."
 IFR-unification-event-flavor:0 "Je mehr das Imperium wuchs, desto schwieriger wurde es zu kontrollieren. Wir haben jetzt alle Länder des Reiches im selben Parlament. Gemeinsam werden wir alle unter eine Identität und ein Land bringen. "
 IFR-unification-option-01:0 "Wir müssen das Haus des Volkes erweitern!"
 IFR-unification-journal_reason:0 "Die Gründung der Kaiserlichen Föderation"

#INC
 INC:0 "Indochina"
 INC_ADJ:0 "Indochina"
 INC_FLAVOR_TEXT:0 "Die Menschen in Indochina haben sich lange Zeit gegenseitig bekämpft, aber diese Zeit ist vorbei. Vereint werden wir uns der Welt und ihren Schwierigkeiten stellen."

 INC-formation-modifier-01:0 "Ein Vielfältiges Land"
  
 INC-unification-journal:0 "Eine Neue Macht In Asien"
 INC-unification-journal-complete:0 "Ist Indochina"
 
 INC-unification-event-title:0 "Aufstehen Gegen Unsere Unterdrücker"
 INC-unification-event-description:0 "Ein schwieriger Weg liegt vor uns."
 INC-unification-event-flavor:0 "Zu lange sind die Länder Indochinas von größeren Mächten außerhalb der Halbinsel schikaniert und unterdrückt worden. Trotz unserer Unterschiede müssen wir zusammenarbeiten, um den Gefahren von außen zu begegnen. "
 INC-unification-option-01:0 "Werden unsere Kulturen in der Lage sein, zusammenzuarbeiten?"
 INC-unification-journal_reason:0 "Die Gründung Indochinas"
 
#TCC
 TCC:0 "Transkaukasien"
 TCC_ADJ:0 "Transkaukasien"
 TCC_FLAVOR_TEXT:0 "Die Menschen im Kaukasus wurden lange Zeit vom russischen Volk unterdrückt, doch damit ist jetzt Schluss! Sie haben sich zusammengeschlossen, um ihrem letzten Feind in diesen unruhigen Zeiten entgegenzutreten. "

 TCC-formation-modifier-01:0 "Bereit Für Einen Kampf"
  
 TCC-unification-journal:0 "Der Kaukasus Ist vereint"
 TCC-unification-journal-complete:0 "Ist Transkaukasien"
 
 TCC-unification-event-title:0 "Unserem Letzten Feind Entgegentreten"
 TCC-unification-event-description:0 "Der Russe wird uns nicht mehr lange unterjochen."
 TCC-unification-event-flavor:0 "Seit vielen Jahren sind die Völker hier im Kaukasus vielen anderen Gruppen unterworfen, wobei die Russen die Haupttäter sind. Wir werden uns nicht länger beugen, wir werden uns auf ihre Invasion vorbereiten. Denn wir wissen, dass sie kommen wird. "
 TCC-unification-option-01:0 "Gemeinsam werden wir stark genug sein, um jeder Bedrohung zu begegnen. "
 TCC-unification-journal_reason:0 "Die Gründung Transkaukasien"
 
#RME
 RME:0 "Römisches Reich"
 RME_ADJ:0 "Römisches Reich"
 RME_FLAVOR_TEXT:0 "Das Römische Reich bestand über tausend Jahre lang... und unter unserer neuen Führung wird es noch weitere tausend Jahre bestehen. Dennoch dürfen wir die Veränderungen in dieser neuen industriellen Welt nicht unterschätzen. "

 RME-formation-modifier-01:0 "Für Den Ruhm Roms"
  
 RME-unification-journal:0 "Die Wiedergeburt Eines Imperiums"
 RME-unification-journal-complete:0 "Ist Das Römische Reich"
 
 RME-unification-event-title:0 "Der Adler Steigt Noch Einmal Auf"
 RME-unification-event-description:0 "Was einst verloren war, wurde wiedergefunden"
 RME-unification-event-flavor:0 "Vor über 1500 Jahren wurde Rom von unserer versagenden Bürokratie und den Germanen zerstört. Mit der Wiedergeburt des Reiches werden wir aus unseren Fehlern lernen und uns rächen!"
 RME-unification-option-01:0 "Diese Barabaren aus dem Norden sollen bekommen, was sie verdienen!"
 RME-unification-journal_reason:0 "Die Gründung des Römischen Reiches"
 
#MGB
 MGB:0 "Maghreb"
 MGB_ADJ:0 "Maghreb"
 MGB_FLAVOR_TEXT:0 "Die Muslime in Westafrika sind sich einig und es liegt nun an ihnen, worauf sie ihre Aufmerksamkeit richten werden. Nach Norden zum Mittelmeer oder nach Süden zum Rest Afrikas"

 MGB-formation-modifier-01:0 "Herausforderung Für Den Mittelmeerraum"
 MGB-formation-modifier-02:0 "Westafrika Gehört Uns"
  
 MGB-unification-journal:0 "Die Vereinigung Der Westlichen Muslime"
 MGB-unification-journal-complete:0 "Ist Maghreb"
 
 MGB-unification-event-title:0 "Eine Neue Macht In Nordafrika"
 MGB-unification-event-description:0 "Worauf werden wir uns konzentrieren?"
 MGB-unification-event-flavor:0 "Wenn die westlichen Muslime vereint sind, müssen wir uns entscheiden, worauf wir unsere Aufmerksamkeit richten wollen. Wir könnten uns auf den Norden und unsere Kontrolle über das Mittelmeer konzentrieren. Oder wir könnten uns auf den Süden konzentrieren und weiter nach Afrika vordringen"
 MGB-unification-option-01:0 "Die neue Macht im Mittelmeerraum."
 MGB-unification-option-02:0 "Wir werden ganz Westafrika kontrollieren."
 MGB-unification-journal_reason:0 "Die Gründung Maghreb"
 
#BSA
 BSA:0 "Baltoskandien"
 BSA_ADJ:0 "Baltoskandien"
 BSA_FLAVOR_TEXT:0 "Die Menschen in den nordischen Ländern haben sich zusammengeschlossen, um sich gegen äußere Bedrohungen ihrer Existenz zu wehren. Sie werden sich der Welt gemeinsam stellen, aber wie wird die Welt darauf reagieren?"

 BSA-formation-modifier-01:0 "Vereint Stehen Wir"
  
 BSA-unification-journal:0 "Die Vereinigung Aller Nordischen Völker"
 BSA-unification-journal-complete:0 "Ist Baltoskandien"
 
 BSA-unification-event-title:0 "Der Nordstaat Beugt Sich Niemandem"
 BSA-unification-event-description:0 "Nur vereint werden wir halten."
 BSA-unification-event-flavor:0 "Im Norden Europas leben viele verschiedene Kulturen, und allein sind wir anfällig für Eroberungen. Aber gemeinsam sind wir eine Macht, mit der man rechnen muss. Niemand soll uns mehr aufhalten.  "
 BSA-unification-option-01:0 "Wir müssen unser Volk vereinen"
 BSA-unification-journal_reason:0 "Die Gründung von Baltoscandia"
 
#BKU
 BKU:0 "Balkan Union"
 BKU_ADJ:0 "Balkan Union"
 BKU_FLAVOR_TEXT:0 "Viele Jahrhunderte lang haben sie sich bekämpft, aber ihre Differenzen wurden beiseite geschoben, um eine Union zu bilden. Viele Staaten betrachten den Balkan als ein geteiltes Land, aber er wird ihnen das Gegenteil beweisen."

 BKU-formation-modifier-01:0 "Keiner Soll Uns Mehr überfallen"
  
 BKU-unification-journal:0 "Die Menschen Auf Dem Balkan Sind Vereint"
 BKU-unification-journal-complete:0 "Is Der Balkan Union"
 
 BKU-unification-event-title:0 "Nicht Mehr Länger Ein Pulverfass"
 BKU-unification-event-description:0 "Wir müssen lernen, uns der Welt gemeinsam zu stellen."
 BKU-unification-event-flavor:0 "Zu lange haben sich die Völker auf dem Balkan untereinander bekämpft. Das hat uns schwach und anfällig für Invasionen von außen gemacht. Unter dieser Union soll das nicht mehr passieren."
 BKU-unification-option-01:0 "Wir müssen unsere Souveränität bewahren"
 BKU-unification-journal_reason:0 "Die Gründung der Balkan Union"
 
#NSE
 NSE:0 "Nordsee-Imperium"
 NSE_ADJ:0 "Nordsee-Imperium"
 NSE_FLAVOR_TEXT:0 "Das alte Wikingerreich formiert sich, aber wird es zusammenbleiben und seine Kontrolle über die Nordsee behalten können?"

 NSE-formation-modifier-01:0 "Die Macht Unserer Marine"
  
 NSE-unification-journal:0 "Ein Neues Wikingerzeitalter Wird Eingeläutet"
 NSE-unification-journal-complete:0 "Ist Das Nordseeimperium"
 
 NSE-unification-event-title:0 "Das Alte Wikingerreich Steht Wieder"
 NSE-unification-event-description:0 "König Knut wäre stolz."
 NSE-unification-event-flavor:0 "Auf dem Höhepunkt der Wikingerzeit waren die Königreiche Norwegen, Dänemark und England unter einer Wikingerkrone vereint. Diese Union war damals eine der stärksten in Europa. Jetzt müssen wir diesen Titel zurückgewinnen und unser Meer schützen."
 NSE-unification-option-01:0 "Die Nordsee ist unser Revier"
 NSE-unification-journal_reason:0 "Die Gründung des Nordseeimperiums"

#FBU
 FBU:0 "Französisch-Britische Union"
 FBU_ADJ:0 "Französisch-Britische Union"
 FBU_FLAVOR_TEXT:0 "Sie mögen seit tausend Jahren Rivalen sein, aber ihre Länder waren immer miteinander verbunden. Diese Verbindung wurde schließlich zu einer echten Union formalisiert."

 FBU-formation-modifier-01:0 "Unser Volk Müssen Zusammenarbeiten"
  
 FBU-unification-journal:0 "Die Folgen Der Normannischen Eroberung"
 FBU-unification-journal-complete:0 "Ist Die Französisch-Britische Union"
 
 FBU-unification-event-title:0 "Jahrhunderte Des Konflikts Sind Zu Ende"
 FBU-unification-event-description:0 "Eine historische Vereinigung endlich verwirklicht"
 FBU-unification-event-flavor:0 "Seit der normannischen Eroberung sind England und Frankreich auf irgendeine Weise miteinander verbunden. Jetzt ist diese Verbindung verwirklicht und ihre Völker sind in einer Union vereint. Werden die anderen Länder in Europa diesen Zusammenschluss akzeptieren?"
 FBU-unification-option-01:0 "Wir müssen diese Union zusammenhalten."
 FBU-unification-journal_reason:0 "Die Gründung der französisch-britischen Union"
 
#ICE
 ICE:0 "Inkareich"
 ICE_ADJ:0 "Inkareich"
 ICE_FLAVOR_TEXT:0 "Vor ein paar hundert Jahren wurde das Inka-Reich von Invasoren zerstört. Jetzt ist es wieder zusammen und es ist an ihnen zu sehen, ob sie bereit sind, mit ihnen zu arbeiten oder sie zu bekämpfen."
 
 ICE-formation-modifier-01:0 "Wir Müssen Daran Arbeiten, Sie Zu Assimilieren"
 ICE-formation-modifier-02:0 "Tod Den Kolonisatoren"
  
 ICE-unification-journal:0 "Das Antike Reich Formt Sich Neu"
 ICE-unification-journal-complete:0 "Ist Das Inkareich"
 
 ICE-unification-event-title:0 "Große Veränderungen Sind Im Gange"
 ICE-unification-event-description:0 "Wie werden wir in die Zukunft blicken?"
 ICE-unification-event-flavor:0 "Als die Spanier kamen, um dieses Land zu kolonisieren, herrschte das Inkareich über dieses Land. Jetzt sind sie wieder vereint. Bei der Diskussion über das weitere Vorgehen versuchten mehrere indigene Mitglieder, in mehrere Regierungsgebäude einzudringen und diese zu übernehmen. Sollte man dies zulassen?"
 ICE-unification-option-01:0 "Nein, wir werden ihnen zeigen, wie wir zusammenarbeiten können."
 ICE-unification-option-02:0 "Ja, wir werden uns an den Kolonisatoren rächen!"
 ICE-culture-warning:0 "WARNUNG! GROSSER KULTURWANDEL"
 ICE-unification-journal_reason:0 "Die Gründung des Inkareiches"
 
#CRT
 CRT:0 "Karthago"
 CRT_ADJ:0 "Karthago"
 CRT_FLAVOR_TEXT:0 "Zu seiner Blütezeit war Karthago der Herrscher des Mittelmeers und wird es wieder sein. Es gibt jedoch mehrere ältere und größere Nationen, die Ähnliches anstreben. Wir müssen sie zurückhalten!"
 
 CRT-formation-modifier-01:0 "Wir Müssen Zu Unseren Wurzeln Zurückkehren"
  
 CRT-unification-journal:0 "Die Reformen Des Handelsimperiums"
 CRT-unification-journal-complete:0 "Ist Karthago"
 
 CRT-unification-event-title:0 "Wir Müssen Die Volle Kontrolle Über Das Mittelmeer Erlangen"
 CRT-unification-event-description:0 "Der gesamte Handel wird über uns laufen."
 CRT-unification-event-flavor:0 "Vor über 2000 Jahren wurde das karthagische Reich von den Römern zerstört. Aber wir sind endlich wieder auferstanden, um unseren rechtmäßigen Platz rund um das Mittelmeer einzunehmen. Unsere Stärke waren Handel und Gewerbe, und so soll es auch wieder sein."
 CRT-unification-option-01:0 "Die Macht unseres Handels wird dominieren"
 CRT-unification-journal_reason:0 "Die Gründung Karthago "
 
#APC
 APCF:0 "Alpenkonföderation"
 APCF_ADJ:0 "Alpenkonföderation"
 APCF_FLAVOR_TEXT:0 "Die Völker rund um die Alpen haben sich zu einer Konföderation zusammengeschlossen. Wird dieser Zusammenschluss stark genug sein, um fremde Mächte abzuwehren, die es auf ihr wertvolles Land abgesehen haben?"
 
 APCF-formation-modifier-01:0 "Eine Bergwirtschaft"
  
 APCF-unification-journal:0 "Die Gebirgskonföderation"
 APCF-unification-journal-complete:0 "Ist Die Alpenkonföderation"
 
 APCF-unification-event-title:0 "Unser Land Im Himmel"
 APCF-unification-event-description:0 "Niemandem außer uns wird der Berg gehören."
 APCF-unification-event-flavor:0 "Die Alpen in der Mitte Europas sind seit Jahrhunderten eine Trennlinie. Viele fremde Mächte haben versucht, sie zu kontrollieren, um auf die andere Seite zu gelangen. Damit ist heute Schluss, die Völker rund um die Alpen haben sich zu einer einzigen Konföderation zusammengeschlossen."
 APCF-unification-option-01:0 "Wir werden die Reichtümer unter unseren Füßen nutzen"
 APCF-unification-journal_reason:0 "Die Gründung der Alpenkonföderation"
 
#LTR
 LTR:0 "Lotharingien"
 LTR_ADJ:0 "Lotharingien"
 LTR_FLAVOR_TEXT:0 ""
 
 LTR-formation-modifier-01:0 "Zwischen Großmächten"
  
 LTR-unification-journal:0 "Das Karolingische Erbe"
 LTR-unification-journal-complete:0 "Ist Lotharingien"
 
 LTR-unification-event-title:0 "Lotharingien Formiert Sich Neu"
 LTR-unification-event-description:0 "Das Reich der Mitte lebt."
 LTR-unification-event-flavor:0 "Nach der Zeit des karolingischen Reiches war Lotharingien die Mitte der abgespaltenen Königreiche. Zwischen den fränkischen und germanischen Königreichen. Irgendwann wurde Lotharingien von diesen Königreichen aufgefressen, aber nicht mehr. Wir werden als Grenzstaat zwischen den Franzosen und den Germanen agieren."
 LTR-unification-option-01:0 "Werden wir in der Lage sein, Angriffe von beiden Seiten abzuwehren?"
 LTR-unification-journal_reason:0 "Die Gründung Lotharingien "

#MDZ
 MDZ:0 "Międzymorze"
 MDZ_ADJ:0 "Międzymorze"
 MDZ_FLAVOR_TEXT:0 ""
 
 MDZ-formation-modifier-01:0 "Unsere Differenzen Ausgleichen"
  
 MDZ-unification-journal:0 "Ein Modernes Commonwealth"
 MDZ-unification-journal-complete:0 "Ist Der Międzymorze"
 
 MDZ-unification-event-title:0 "Ein Panslawischer Staat"
 MDZ-unification-event-description:0 "Osteuropa Vereinigt Sich."
 MDZ-unification-event-flavor:0 "Die Idee der Międzymorze war ursprünglich als Nachfolgestaat des polnisch-litauischen Commonwealth gedacht, und das werden wir auch sein. Wir werden jedoch alle verschiedenen slawischen Völker für eine stärkere Union akzeptieren."
 MDZ-unification-option-01:0 "Wird dieses Experiment Bestand haben?"
 MDZ-unification-journal_reason:0 "Die Bildung der Międzymorze"
 
#TMD
 TMD:0 "Timuridenreich"
 TMD_ADJ:0 "Timuridenreich"
 TMD_FLAVOR_TEXT:0 "Der ursprüngliche Gründer des Timuridenreichs sah sich als offizieller Erbe des Mongolenreichs. Da diese Länder nun wieder vereint sind, werden wir uns sowohl nach Osten als auch nach Westen orientieren."
 
 TMD-formation-modifier-01:0 "Brücke Zwischen Ost Und West"
  
 TMD-unification-journal:0 "Erbe Des Mongolenreichs"
 TMD-unification-journal-complete:0 "Ist das Timuridenreich"
 
 TMD-unification-event-title:0 "Das Alte Reich Wieder Vereint"
 TMD-unification-event-description:0 "Iran-u-Turan regiert wieder."
 TMD-unification-event-flavor:0 "Der ursprüngliche Gründer des Timuridenreichs sah sich als Erbe des Mongolenreichs, und er hatte Recht. Genau wie wir heute. Wenn unser Reich steht, werden wir als Brücke zwischen Ost und West fungieren, wir werden das Land sein, das alle anderen Länder miteinander verbindet."
 TMD-unification-option-01:0 "Die Welt verbinden"
 TMD-unification-journal_reason:0 "Die Gründung des Timuridenreiches"

#MCE
 MCE:0 "Makedonisches Reich"
 MCE_ADJ:0 "Makedonisches Reich"
 MCE_FLAVOR_TEXT:0 "Vor über 2000 Jahren gründete Alexander der Große eines der größten Reiche der antiken Welt. Seine Zeit war kurz und sein Reich zerfiel. Es wurde wieder gegründet und hat die Geschichte für immer verändert."
 
 MCE-formation-modifier-01:0 "Alte Mazedonische Stärke"
  
 MCE-unification-journal:0 "Der Erbe Von Alexander"
 MCE-unification-journal-complete:0 "Ist das Makedonische Reich"
 
 MCE-unification-event-title:0 "Alexander Würde Stolz Sein"
 MCE-unification-event-description:0 "Die Macht von Macadonia zeigt sich wieder."
 MCE-unification-event-flavor:0 "Alexander der Große gründete eines der größten Reiche der antiken Welt. Doch durch seinen frühen Tod wurde es zersplittert und brach zusammen. Wir werden sein Erbe fortsetzen!"
 MCE-unification-option-01:0 "Alexanders Erbe"
 MCE-unification-journal_reason:0 "Die Gründung des Makedonischen Reiches"

#FUG
 FUG:0 "Finno-Ugria"
 FUG_ADJ:0 "Finno-Ugria"
 FUG_FLAVOR_TEXT:0 "Die Völker Nordskandinaviens und Nordrusslands sind seit langem durch die Geschichte miteinander verbunden. Wird es ihnen gelingen, die anderen Großmächte in ihrer nördlichen Hochburg in Schach zu halten?"
 
 FUG-formation-modifier-01:0 "Nördliche Stärke"
  
 FUG-unification-journal:0 "Die Menschen Im Norden Vereinen"
 FUG-unification-journal-complete:0 "Ist Finno-Ugria"
 
 FUG-unification-event-title:0 "Zwei Kulturen Verschmelzen"
 FUG-unification-event-description:0 "Wir sind ein hartes Volk."
 FUG-unification-event-flavor:0 "Das finnische und das ugiesische Volk haben eine kulturelle und sprachliche Verbindung, die Tausende von Jahren zurückreicht. Wir sind nun zu einem Staat verbunden, um den Gefahren von außen zu begegnen."
 FUG-unification-option-01:0 "Schützen Sie unsere Kutluren"
 FUG-unification-journal_reason:0 "Die gründung von Forming Finno-Ugria"

#POLY
 POLY:0 "Polynesien"
 POLY_ADJ:0 "Polynesien"
 POLY_FLAVOR_TEXT:0 "Polynesien kontrolliert ein großes Gebiet auf dem Globus, aber nur wenig Land. Viele fremde Mächte versuchen, dies für ihre Zwecke auszunutzen. Wird Polynesien in der Lage sein, die Invasoren abzuwehren und in eine unabhängige Zukunft zu blicken?"
 
 POLY-formation-modifier-01:0 "Unsere Inseln Sind Unsere Stärke"
  
 POLY-unification-journal:0 "Die Vereinigung Der Polynesischen Inseln"
 POLY-unification-journal-complete:0 "Ist Polynesien"
 
 POLY-unification-event-title:0 "Ein gemeinsamer Ozean"
 POLY-unification-event-description:0 "Wir werden nicht kolonisiert werden."
 POLY-unification-event-flavor:0 "Die Völker in Polynesien sind nur wenige, aber gemeinsam haben wir eine Chance, uns gegen mögliche Eindringlinge zu wehren. Wir müssen unsere Kultur schützen, denn sie ist vielfältig. "
 POLY-unification-option-01:0 "Die Macht des Meeres wird uns beschützen"
 POLY-unification-journal_reason:0 "Die Gründung Polynesiens"

#GLE
 GLE:0 "Reich der Großen Seen"
 GLE_ADJ:0 "Reich der Großen Seen"
 GLE_FLAVOR_TEXT:0 "Afrika ist ein vielfältiger Ort, und das Land um die großen Seen ist nicht anders. Den Völkern dort ist es gelungen, sich trotz ihrer Unterschiede zu vereinen, und sie müssen nun nach außen schauen, um ihre Unabhängigkeit zu bewahren. "
 
 GLE-formation-modifier-01:0 "Kampf Um Die Seen"
  
 GLE-unification-journal:0 "Das Reich Der Seen"
 GLE-unification-journal-complete:0 "Ist Great Lakes Empire"
 
