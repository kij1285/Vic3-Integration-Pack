#Diplo form Event
USE_formation.17-title:0 "Europa ist endlich vereint"
USE_formation.17-description:0 "Dieser historische Tag ist nun endlich gekommen."
USE_formation.17-flavor:0 "Auf diplomatischer Ebene sind wir bereit, diesen historischen Schritt zu tun und Europa unter einem einzigen Land zu vereinen, aber unsere Logistik ist vielleicht noch nicht bereit dafür. Wir können diesen Schritt jederzeit zu einem späteren Zeitpunkt tun. (WICHTIGER HINWEIS: Dies wird alle Ihre europäischen Untertanen annektieren. Achten Sie darauf, dass sie nicht vom Rest Ihres Landes abgetrennt werden.)"
USE_formation_diplo_form_USE-01:0 "Auf den richtigen Moment warten"
