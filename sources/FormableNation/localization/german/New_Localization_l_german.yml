je_bnl_religion:0 "Die Angelegenheit der Religion"
je_bnl_religion_reason:0 "In der Vergangenheit waren wir geeint, aber es kam schnell zu Konflikten über die Religion. Diese Probleme müssen angegangen werden, denn erst dann werden wir wirklich eine geeinte Nation sein. "
je_bnl_religion_goal: "Weniger als 25% Aufruhr in #tooltippable #tooltip:bnl_core #bold core#!#!#!  [SCOPE.GetRootScope.GetCountry.GetName] regionen seit 10 Jahren."
