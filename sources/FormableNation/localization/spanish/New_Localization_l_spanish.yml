#CRT
 CRT:0 "Cartago"
 CRT_ADJ:0 "Cartago"
 CRT_FLAVOR_TEXT:0 "En su apogeo Cartago fue el gobernante del Mediterráneo y lo serán de nuevo. Sin embargo, hay varias naciones más antiguas y grandes que apuntan a cosas similares. ¡Debemos detenerlas!"
 
 CRT-formation-modifier-01:0 "Debemos Volver a Nuestras Raíces"
  
 CRT-unification-journal:0 "El Imperio Comercial se Reforma"
 CRT-unification-journal-complete:0 "Es Cartago"
 
 CRT-unification-event-title:0 "Debemos Obtener el Control Total del Mediterráneo"
 CRT-unification-event-description:0 "Todo el comercio fluirá a través de nosotros."
 CRT-unification-event-flavor:0 "Hace más de 2000 años el Imperio Cartaginés fue destruido por los romanos. ¡Pero finalmente hemos resurgido para tomar nuestro lugar legítimo alrededor del Mediterráneo! Nuestra fuerza fue nuestro comercio y lo será de nuevo."
 CRT-unification-option-01:0 "El Poder de Nuestro Comercio Dominará"
 CRT-unification-journal_reason:0 "Formando Cartago"
 CRT-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],CRT-modifier-effect-tt $CRT-formation-modifier-01$#!" 
 CRT-modifier-effect-tt: "[GetStaticModifier('CRT-formation-modifier-01').GetName|v]\n[GetStaticModifier('CRT-formation-modifier-01').GetDesc]"
 
#APC
 APCF:0 "Confederación Alpina"
 APCF_ADJ:0 "Confederación Alpina"
 APCF_FLAVOR_TEXT:0 "La gente alrededor de los Alpes se ha unido en una confederación. ¿Será esta unión lo suficientemente fuerte para mantener a raya a las potencias extranjeras que buscan su valiosa tierra?"
 
 APCF-formation-modifier-01:0 "Una Economía de Montaña"
  
 APCF-unification-journal:0 "La Confederación de Montaña"
 APCF-unification-journal-complete:0 "Es la Confederación Alpina"
 
 APCF-unification-event-title:0 "Nuestro País en el Cielo"
 APCF-unification-event-description:0 "Nadie será dueño de la montaña excepto nosotros."
 APCF-unification-event-flavor:0 "Los Alpes en el centro de Europa han sido una línea divisoria durante siglos. Muchas potencias extranjeras han intentado controlarlo para llegar al otro lado. Esto termina hoy, la gente alrededor de los alpes se ha unido en una sola confederación."
 APCF-unification-option-01:0 "Usaremos las Riquezas Bajo Nuestros Pies"
 APCF-unification-journal_reason:0 "Formando la Confederación Alpina"
 APCF-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],APCF-modifier-effect-tt $APCF-formation-modifier-01$#!" 
