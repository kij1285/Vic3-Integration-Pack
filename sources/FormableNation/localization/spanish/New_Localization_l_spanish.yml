#MDZ
 MDZ:0 "Międzymorze"
 MDZ_ADJ:0 "Międzymorze"
 MDZ_FLAVOR_TEXT:0 "El concepto del Międzymorze ha sido durante mucho tiempo una cooperación entre el pueblo eslavo. ¿Resistirá esta unión la prueba del tiempo?"
 
 MDZ-formation-modifier-01:0 "Enmendando Nuestras Diferencias"
  
 MDZ-unification-journal:0 "Una Mancomunidad Moderna"
 MDZ-unification-journal-complete:0 "Es el Międzymorze"
 
 MDZ-unification-event-title:0 "Un Estado Paneslavo"
 MDZ-unification-event-description:0 "Europa del Este se une."
 MDZ-unification-event-flavor:0 "La idea del Międzymorze fue originalmente concebida como un estado sucesor de la Mancomunidad Polaco-Lituana y eso es lo que seremos. Sin embargo, aceptaremos a todos los diferentes pueblos eslavos para una unión más fuerte."
 MDZ-unification-option-01:0 "¿Se Mantendrá Unido Este Experimento?"
