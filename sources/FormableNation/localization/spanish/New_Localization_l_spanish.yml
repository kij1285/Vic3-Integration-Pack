#BKU
 BKU:0 "Unión Balcánica"
 BKU_ADJ:0 "Unión Balcánica"
 BKU_FLAVOR_TEXT:0 "Durante muchos siglos han luchado, pero sus diferencias han sido dejadas de lado para formar una unión. Muchos estados miran a los Balcanes como una tierra dividida pero les demostrarán que están equivocados."

 BKU-formation-modifier-01:0 "Nadie Nos Invadirá de Nuevo"
  
 BKU-unification-journal:0 "La Gente en los Balcanes está Unida"
 BKU-unification-journal-complete:0 "Es la Unión Balcánica"
 
 BKU-unification-event-title:0 "Ya No es un Polvorín"
 BKU-unification-event-description:0 "Debemos aprender a enfrentar al mundo juntos."
 BKU-unification-event-flavor:0 "Durante demasiado tiempo los pueblos en los Balcanes han luchado entre sí. Esto nos mantuvo débiles y abiertos a invasiones desde el exterior. Bajo esta unión esto ya no sucederá."
 BKU-unification-option-01:0 "Debemos Mantener Nuestra Soberanía"
 BKU-unification-journal_reason:0 "Formando la Unión Balcánica"
 BKU-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],BKU-modifier-effect-tt $BKU-formation-modifier-01$#!" 
 BKU-modifier-effect-tt: "[GetStaticModifier('BKU-formation-modifier-01').GetName|v]\n[GetStaticModifier('BKU-formation-modifier-01').GetDesc]"
 
#NSE
 NSE:0 "Imperio del Mar del Norte"
 NSE_ADJ:0 "Imperio del Mar del Norte"
 NSE_FLAVOR_TEXT:0 "El viejo imperio vikingo se formó pero ¿será capaz de mantenerse unido y mantener su control sobre el Mar del Norte?"

 NSE-formation-modifier-01:0 "El Poder de Nuestra Armada"
  
 NSE-unification-journal:0 "Inaugurando una Nueva Era Vikinga"
 NSE-unification-journal-complete:0 "Es el Imperio del Mar del Norte"
 
 NSE-unification-event-title:0 "El Viejo Imperio Vikingo Se Mantiene de Nuevo"
 NSE-unification-event-description:0 "El Rey Cnut estaría orgulloso."
 NSE-unification-event-flavor:0 "Durante el apogeo de la era vikinga los reinos de Noruega, Dinamarca e Inglaterra estaban unidos bajo una corona vikinga. Esta unión fue una de las más fuertes en Europa en ese momento, ahora tenemos que recuperar ese título y proteger nuestro mar."
 NSE-unification-option-01:0 "El Mar del Norte es Nuestro Territorio"
 NSE-unification-journal_reason:0 "Formando el Imperio del Mar del Norte"
 NSE-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],NSE-modifier-effect-tt $NSE-formation-modifier-01$#!" 
 NSE-modifier-effect-tt: "[GetStaticModifier('NSE-formation-modifier-01').GetName|v]\n[GetStaticModifier('NSE-formation-modifier-01').GetDesc]"

#FBU
 FBU:0 "Unión Franco-Británica"
 FBU_ADJ:0 "Unión Franco-Británica"
 FBU_FLAVOR_TEXT:0 "Pueden haber sido rivales durante mil años pero sus países siempre han estado conectados. Esta conexión finalmente se ha formalizado en una unión real."

 FBU-formation-modifier-01:0 "Nuestra Gente Debe Trabajar Junta"
  
 FBU-unification-journal:0 "Las Consecuencias de la Conquista Normanda"
 FBU-unification-journal-complete:0 "Es la Unión Franco-Británica"
 
 FBU-unification-event-title:0 "Siglos de Conflicto Han Terminado"
 FBU-unification-event-description:0 "Una unión histórica finalmente realizada"
 FBU-unification-event-flavor:0 "Desde la Conquista Normanda, Inglaterra y Francia han estado conectados de alguna manera. Ahora esta conexión se ha realizado y su gente se ha unido bajo una unión. ¿Aceptarán los otros países en Europa esta fusión?"
 FBU-unification-option-01:0 "Debemos Mantener Esta Unión Junta."
 FBU-unification-journal_reason:0 "Formando la Unión Franco-Británica"
 FBU-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],FBU-modifier-effect-tt $FBU-formation-modifier-01$#!" 
 FBU-modifier-effect-tt: "[GetStaticModifier('FBU-formation-modifier-01').GetName|v]\n[GetStaticModifier('FBU-formation-modifier-01').GetDesc]"
 
#ICE
 ICE:0 "Imperio Inca"
 ICE_ADJ:0 "Imperio Inca"
 ICE_FLAVOR_TEXT:0 "Hace unos cientos de años el Imperio Inca fue destruido por invasores. Ahora está de vuelta junto y les toca a ellos ver si están dispuestos a trabajar con ellos o luchar contra ellos."
 
 ICE-formation-modifier-01:0 "Debemos Trabajar para Asimilarlos"
 ICE-formation-modifier-02:0 "Muerte a los Colonizadores"
  
 ICE-unification-journal:0 "El Antiguo Imperio Se Forma de Nuevo"
 ICE-unification-journal-complete:0 "Es el Imperio Inca"
 
 ICE-unification-event-title:0 "Grandes Cambios Están en Marcha"
 ICE-unification-event-description:0 "¿Cómo miraremos hacia el futuro?"
 ICE-unification-event-flavor:0 "Cuando los españoles vinieron a colonizar esta tierra el Imperio Inca gobernaba estas tierras. Ahora están unidos de nuevo. Al discutir cómo proceder, varios miembros indígenas estaban tratando de entrar para tomar el control de varios edificios gubernamentales. ¿Debería permitirse esto?"
 ICE-unification-option-01:0 "No, Les Mostraremos Cómo Podríamos Trabajar Juntos."
 ICE-unification-option-02:0 "Sí, ¡Tendremos Nuestra Venganza Contra los Colonizadores!"
 ICE-culture-warning:0 "¡ADVERTENCIA! CAMBIO CULTURAL IMPORTANTE"
 ICE-unification-journal_reason:0 "Formando el Imperio Inca"
 ICE-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ICE-modifier-effect-tt $ICE-formation-modifier-01$#! \n or \n• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ICE-modifier-effect-tt-2 $ICE-formation-modifier-02$#! \n Major Culture Change" 
