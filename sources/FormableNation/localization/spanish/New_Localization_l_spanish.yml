 LTR-unification-journal:0 "El Legado Carolingio"
 LTR-unification-journal-complete:0 "Es Lotaringia"
 
 LTR-unification-event-title:0 "Lotaringia Se Forma de Nuevo"
 LTR-unification-event-description:0 "El reino medio vive."
 LTR-unification-event-flavor:0 "Después del tiempo del imperio Carolingio, Lotaringia fue el medio de los reinos separados. Entre los reinos franco y germánico. Eventualmente Lotaringia fue devorada por estos reinos pero ya no más. Actuaremos como un estado fronterizo entre los franceses y los alemanes."
 LTR-unification-option-01:0 "¿Seremos Capaces de Resistir los Ataques de Ambos Lados?"
 LTR-unification-journal_reason:0 "Formando Lotaringia"
