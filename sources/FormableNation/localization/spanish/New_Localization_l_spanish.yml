je_bnl_religion:0 "El Asunto de la Religión"
je_bnl_religion_reason:0 "Estuvimos unidos en el pasado pero los conflictos sobre religión rápidamente siguieron. Estos problemas deben ser abordados, porque no seremos verdaderamente una nación unida hasta ese momento."
je_bnl_religion_goal: "Menos del 25% de agitación en las regiones #tooltippable #tooltip:bnl_core #bold centrales#!#!#! de [SCOPE.GetRootScope.GetCountry.GetName] durante 10 años."
