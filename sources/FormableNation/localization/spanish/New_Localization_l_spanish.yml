BNL-religion-event-title:0 "Los Peores Conflictos Han Terminado"
BNL-religion-event-description:0 "Los conflictos religiosos se reducen a un mínimo."
BNL-religion-event-flavor:0 "El norte protestante y el sur católico han estado opuestos durante mucho tiempo. Pero a través del trabajo diligente la mayoría de los conflictos han disminuido. ¿Puede la nación alguna vez verdaderamente seguir adelante?"
BNL-religion-option-01:0 "Unificados Bajo Diferentes Religiones"
BNL-religion-modifier-01:0 "Conflictos Religiosos Reducidos"

je_bnl_trade_or_industry:0 "¿Enfoque en Comercio o Industria?"
je_bnl_trade_or_industry_reason: "El norte de nuestro país se ha enfocado en el comercio durante los últimos 200 años, pero nuestro sur ha sido una potencia industrial desde la edad media.\n\n¿Cuál de estas identidades perseguiremos para impulsarnos hacia esta nueva era? Solo podemos elegir una así que debemos elegir cuidadosamente."
bnl_trade_or_industry_industry:0 "Nos hemos enfocado en la industria"
bnl_trade_or_industry_trade:0 "Nos hemos enfocado en el comercio"

je_bnl_industry: "Enfoque: Industria"
je_bnl_industry_reason:0 "La industria es lo que está permitiendo a países como Gran Bretaña y Francia crecer y convertirse en verdaderas Grandes Potencias. Debemos seguir este ejemplo y permitir que nuestra industria nos impulse hacia la siguiente era."
je_bnl_industry_goal:0 "Completar todas las políticas industriales."
je_bnl_industry_1: "Política Industrial: Producción Doméstica"
je_bnl_industry_1_reason:0 "Para impulsar nuestras industrias locales debemos ser en su mayoría autosuficientes en los 2 bienes más importantes de esta era, Hierro y Carbón."
je_bnl_industry_2: "Política Industrial: Crecimiento Económico"
je_bnl_industry_2_reason:0 "Para competir con las otras grandes potencias debemos mantener un cierto nivel de crecimiento para asegurar nuestro lugar en la mesa de negociación."
je_bnl_industry_3: "Política Industrial: Proteger Nuestra Industria"
je_bnl_industry_3_reason:0 "No podemos tener a otros países vendiendo todas sus mercancías a nosotros a un precio más bajo. Esto socavará nuestras propias industrias, debemos poner salvaguardas en su lugar."

je_bnl_trade: "Enfoque: Comercio"
je_bnl_trade_reason:0 "El mundo se está volviendo cada vez más global y el comercio está facilitando esto. Al ser uno de los pioneros de este movimiento podemos estar adelante de la curva y cosechar los beneficios."
je_bnl_trade_goal:0 "Completar todas las políticas comerciales."

bnl_industry_complete:0 "Progreso en el Camino de la Industria"
bnl_trade_complete:0 "Progreso en el Camino del Comercio"

je_bnl_trade_1: "Política Comercial: Buques Comerciales"
je_bnl_trade_1_reason:0 "Para conducir comercio mundial necesitamos suficientes buques para tolerar este volumen aumentado."
je_bnl_trade_2: "Política Comercial: Capacidad Comercial"
je_bnl_trade_2_reason:0 "Gestionar el comercio y recoger sus ganancias toma tiempo y gente, tenemos que asegurar que tengamos la infraestructura requerida para facilitar esto."
je_bnl_trade_3: "Política Comercial: Libre Comercio"
je_bnl_trade_3_reason:0 "La libertad del comercio globalizado es el futuro. Nuestras leyes deben estar listas para entrar en este nuevo mundo."

BNL-industry-event-title:0 "Una Potencia Industrial"
BNL-industry-event-description:0 "Hemos elegido el camino de la industrialización masiva."
BNL-industry-event-flavor:0 "El bullicio de la industria y los sonidos de máquinas de vapor masivas. Esto se puede escuchar en todo el país, ha tomado mucho tiempo y esfuerzo pero podemos contarnos entre las potencias industriales del mundo."
BNL-industry-option-01:0 "Un Brindis por el Poder de la Máquina de Vapor"
BNL-industry-modifier-01:0 "La Industria Pesada es el Futuro"

BNL-trade-event-title:0 "El Primer Centro de Comercio Mundial"
BNL-trade-event-description:0 "Hemos elegido el camino del comercio global."
BNL-trade-event-flavor:0 "Nuestros barcos alcanzan cada rincón del mundo, desde los yermos fríos de Siberia hasta los bulliciosos puertos de Londres y Nueva York. Nuestro logo es conocido por cada hogar, ya que la mayoría de los productos pasan por nuestros puertos al menos una vez."
BNL-trade-option-01:0 "Nadie Nos Derribará"
BNL-trade-modifier-01:0 "Comercio Interminable"

