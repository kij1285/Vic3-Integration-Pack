#BSA
 BSA:0 "Baltoscandia"
 BSA_ADJ:0 "Baltoscandia"
 BSA_FLAVOR_TEXT:0 "La gente en los países nórdicos se ha unido para defenderse de amenazas externas a su existencia. Enfrentarán al mundo juntos, ¿pero cómo responderá el mundo?"

 BSA-formation-modifier-01:0 "Unidos Permanecemos"
  
 BSA-unification-journal:0 "Uniendo a Todos los Pueblos Nórdicos"
 BSA-unification-journal-complete:0 "Es Baltoscandia"
 
 BSA-unification-event-title:0 "El Estado del Norte No Se Inclinará Ante Nadie"
 BSA-unification-event-description:0 "Solo unidos resistiremos."
 BSA-unification-event-flavor:0 "Muchas culturas diferentes viven en el norte de Europa y solos somos propensos a ser conquistados. Pero juntos somos una fuerza a tener en cuenta. Nadie nos detendrá más."
 BSA-unification-option-01:0 "Necesitamos Unir a Nuestra Gente"
 BSA-unification-journal_reason:0 "Formando Baltoscandia"
 BSA-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],BSA-modifier-effect-tt $BSA-formation-modifier-01$#!" 
