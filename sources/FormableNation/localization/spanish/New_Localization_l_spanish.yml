l_spanish:
je_formable_nations_plus: "Naciones Formables Plus"
#HRE
 HRE:0 "Sacro Imperio Romano"
 HRE_ADJ:0 "del Sacro Imperio Romano"
 HRE_FLAVOR_TEXT:0 "Este imperio es poderoso, vasto y diverso, ¿será capaz de mantenerse unido y gobernar el continente como lo hizo en épocas pasadas?"

 HRE-formation-modifier-01:0 "En el Corazón de Europa"
  
 HRE-unification-journal:0 "Un Imperio Renacido"
 HRE-unification-journal-complete:0 "Es el Sacro Imperio Romano"
 
 HRE-unification-event-title:0 "El Sacro Imperio Romano Renacido"
 HRE-unification-event-description:0 "El renacimiento del águila bicéfala."
 HRE-unification-event-flavor:0 "Durante casi un milenio el Sacro Imperio Romano creció y cayó con el golpe final viniendo de Napoleón. Este error finalmente ha sido rectificado y todas las personas en este imperio estarán más fuertes juntas. El futuro se muestra favorable para todos nosotros."
 HRE-unification-option-01:0 "El nacimiento de una superpotencia europea."
 HRE-unification-journal_reason:0 "Formando el Sacro Imperio Romano"
 HRE-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],HRE-modifier-effect-tt $HRE-formation-modifier-01$#!" 
 HRE-modifier-effect-tt: "[GetStaticModifier('HRE-formation-modifier-01').GetName|v]\n[GetStaticModifier('HRE-formation-modifier-01').GetDesc]"

#Benelux
 BNL:0 "Benelux"
 BNL_ADJ:0 "Benelux"
 BNL_FLAVOR_TEXT:0 "Puede parecer pequeño pero el Benelux tiene la oportunidad de convertirse en un gran jugador en Europa. Todo lo que tiene que hacer es tomarla."

 BNL-formation-modifier-01:0 "Acorralado Entre Grandes Potencias"
  
 BNL-unification-journal:0 "Las Tierras Bajas Unidas"
 BNL-unification-journal-complete:0 "Es el Benelux"
 
 BNL-unification-event-title:0 "El Benelux Finalmente Reunificado"
 BNL-unification-event-description:0 "El nuevo león ruge."
 BNL-unification-event-flavor:0 "Las tierras bajas finalmente están juntas de nuevo después de ser separadas a la fuerza. Está claro que somos más fuertes juntos pero somos jóvenes y estamos rodeados. Se deben encontrar alianzas y se deben aplastar rivales si queremos sobrevivir a la embestida venidera."
 BNL-unification-option-01:0 "¿Cómo competiremos con las otras grandes potencias en Europa?"
 BNL-unification-journal_reason:0 "Formando el Benelux"
 BNL-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],BNL-modifier-effect-tt $BNL-formation-modifier-01$#!" 
 BNL-modifier-effect-tt: "[GetStaticModifier('BNL-formation-modifier-01').GetName|v]\n[GetStaticModifier('BNL-formation-modifier-01').GetDesc]"

#UCB
 UCB:0 "Caribe Unido"
 UCB_ADJ:0 "Caribe Unido"
 UCB_FLAVOR_TEXT:0 "Con todas sus islas bajo una sola bandera, el Caribe Unido enfrentará un futuro desafiante. Está rodeado de grandes potencias que están más que dispuestas a ejercer control sobre él."

 UCB-formation-modifier-01:0 "Un Reino Pirata Moderno"
  
 UCB-unification-journal:0 "Unificación del Caribe"
 UCB-unification-journal-complete:0 "Es el Caribe Unido"
 
 UCB-unification-event-title:0 "El Caribe Bajo Una Sola Bandera"
 UCB-unification-event-description:0 "La segunda edad de oro de la piratería ha comenzado."
 UCB-unification-event-flavor:0 "Durante siglos el caribe ha estado bajo el control de extranjeros, ¡ya no más! Tenemos algunas de las capitales piratas más antiguas del mundo y lo serán de nuevo. ¡Inauguraremos una nueva era de piratería!"
 UCB-unification-option-01:0 "¡Construyan los astilleros y entrenen a los marineros!"
 UCB-unification-journal_reason:0 "Formando el Caribe Unido"
 UCB-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],UCB-modifier-effect-tt $UCB-formation-modifier-01$#!" 
 UCB-modifier-effect-tt: "[GetStaticModifier('UCB-formation-modifier-01').GetName|v]\n[GetStaticModifier('UCB-formation-modifier-01').GetDesc]"

#IFR
 IFR:0 "Federación Imperial"
 IFR_ADJ:0 "Federación Imperial"
 IFR_FLAVOR_TEXT:0 "Un imperio federal global, el primero de su tipo. Tiene mucho poder pero esto viene con muchos problemas y áreas de control. ¿Puede el imperio mantenerse unido y realmente gobernar las olas?"

 IFR-formation-modifier-01:0 "Un Imperio Federal Global"
  
 IFR-unification-journal:0 "Un Imperio Global"
 IFR-unification-journal-complete:0 "Es la Federación Imperial"
 
 IFR-unification-event-title:0 "Todo el Imperio Bajo una Bandera"
 IFR-unification-event-description:0 "Una nueva era de diplomacia ha comenzado."
 IFR-unification-event-flavor:0 "Cuanto más crecía el imperio, más difícil se volvía controlarlo. Ahora tenemos todos los países dentro del imperio en el mismo parlamento. Juntos llevaremos a todos bajo una misma identidad y país."
 IFR-unification-option-01:0 "¡Tendremos que expandir la cámara de los comunes!"
 IFR-unification-journal_reason:0 "Formando la Federación Imperial"
 IFR-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],IFR-modifier-effect-tt $IFR-formation-modifier-01$#!" 
 IFR-modifier-effect-tt: "[GetStaticModifier('IFR-formation-modifier-01').GetName|v]\n[GetStaticModifier('IFR-formation-modifier-01').GetDesc]"

#INC
 INC:0 "Indochina"
 INC_ADJ:0 "Indochina"
 INC_FLAVOR_TEXT:0 "La gente en Indochina ha luchado entre sí durante mucho tiempo pero ese tiempo ha terminado. Unidos enfrentaremos al mundo y sus tribulaciones."

 INC-formation-modifier-01:0 "Un País Diverso"
  
 INC-unification-journal:0 "Un Nuevo Poder en Asia"
 INC-unification-journal-complete:0 "Es Indochina"
 
 INC-unification-event-title:0 "Levantarse Contra Nuestros Opresores"
 INC-unification-event-description:0 "Un camino difícil por delante."
 INC-unification-event-flavor:0 "Durante demasiado tiempo los países en Indochina han sido intimidados y reprimidos por potencias más grandes fuera de la península. A pesar de nuestras diferencias tendremos que trabajar juntos para enfrentar los peligros externos."
 INC-unification-option-01:0 "¿Serán nuestras culturas capaces de trabajar juntas?"
 INC-unification-journal_reason:0 "Formando Indochina"
 INC-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],INC-modifier-effect-tt $INC-formation-modifier-01$#!" 
 INC-modifier-effect-tt: "[GetStaticModifier('INC-formation-modifier-01').GetName|v]\n[GetStaticModifier('INC-formation-modifier-01').GetDesc]"
 
#TCC
 TCC:0 "Transcaucasia"
 TCC_ADJ:0 "Transcaucasia"
 TCC_FLAVOR_TEXT:0 "La gente en el cáucaso ha sido oprimida durante mucho tiempo por el pueblo ruso, ¡pero no más! Han sido unidos para enfrentar a su enemigo final en estos tiempos difíciles."

 TCC-formation-modifier-01:0 "Listos para una Pelea"
  
 TCC-unification-journal:0 "El Cáucaso está Unido"
 TCC-unification-journal-complete:0 "Es Transcaucasia"
 
 TCC-unification-event-title:0 "Para Enfrentar a Nuestro Enemigo Final"
 TCC-unification-event-description:0 "Los rusos ya no nos subyugarán."
 TCC-unification-event-flavor:0 "Durante muchos años los pueblos aquí en el Cáucaso han estado sujetos a muchos otros grupos, siendo los rusos los principales ofensores. Ya no nos inclinaremos, nos prepararemos para su invasión. Porque sabemos que vendrá."
 TCC-unification-option-01:0 "Unidos seremos lo suficientemente fuertes para enfrentar cualquier amenaza."
 TCC-unification-journal_reason:0 "Formando Transcaucasia"
 TCC-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],TCC-modifier-effect-tt $TCC-formation-modifier-01$#!" 
 TCC-modifier-effect-tt: "[GetStaticModifier('TCC-formation-modifier-01').GetName|v]\n[GetStaticModifier('TCC-formation-modifier-01').GetDesc]"
 
#RME
 RME:0 "Imperio Romano"
 RME_ADJ:0 "Imperio Romano"
 RME_FLAVOR_TEXT:0 "El imperio romano perduró durante más de mil años... y bajo nuestro nuevo liderazgo continuará perdurando por otros mil. Pero aun así, no debemos subestimar los cambios de este nuevo mundo industrial."

 RME-formation-modifier-01:0 "Por la Gloria de Roma"
  
 RME-unification-journal:0 "El Renacimiento de un Imperio"
 RME-unification-journal-complete:0 "Es el Imperio Romano"
 
 RME-unification-event-title:0 "El Águila Se Eleva Una Vez Más"
 RME-unification-event-description:0 "Lo que una vez se perdió ha sido encontrado de nuevo"
 RME-unification-event-flavor:0 "Hace más de 1500 años Roma fue destruida por nuestra burocracia fallida y los pueblos germánicos. ¡Con el imperio renacido aprenderemos de nuestros errores y tendremos nuestra venganza!"
 RME-unification-option-01:0 "¡Esos bárbaros del norte obtendrán lo que merecen!"
 RME-unification-journal_reason:0 "Formando el Imperio Romano"
 RME-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],RME-modifier-effect-tt $RME-formation-modifier-01$#!" 
 RME-modifier-effect-tt: "[GetStaticModifier('RME-formation-modifier-01').GetName|v]\n[GetStaticModifier('RME-formation-modifier-01').GetDesc]"
 RME-decision-maghrebi-explanation: "#;bold Opciones:#!# \nIntegrar Magrebí por Burocracia y Autoridad\nIntegrar Magrebí por Burocracia y Capacidad Fiscal\nCancelar Integración"
 
#MGB
 MGB:0 "Magreb"
 MGB_ADJ:0 "Magreb"
 MGB_FLAVOR_TEXT:0 "Los musulmanes en África Occidental están unidos y ahora depende de ellos dónde centrarán su atención. Norte hacia el Mediterráneo o sur hacia el resto de África"

 MGB-formation-modifier-01:0 "Desafío por el Mediterráneo"
 MGB-formation-modifier-02:0 "África Occidental es Nuestra"
  
 MGB-unification-journal:0 "Uniendo a los Musulmanes Occidentales"
 MGB-unification-journal-complete:0 "Es Magreb"
 
 MGB-unification-event-title:0 "Un Nuevo Poder en el Norte de África"
 MGB-unification-event-description:0 "¿En qué nos enfocaremos?"
 MGB-unification-event-flavor:0 "Con los musulmanes occidentales unidos debemos elegir dónde centraremos nuestra atención. Podríamos enfocarnos en el norte y nuestro control del Mediterráneo. O podríamos enfocarnos en el sur y continuar más adentro de África"
 MGB-unification-option-01:0 "El Nuevo Poder en el Mediterráneo."
 MGB-unification-option-02:0 "Controlaremos Toda África Occidental."
 MGB-unification-journal_reason:0 "Formando Magreb"
 MGB-journal-completed-effects_tt.1: "• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],MGB-modifier-effect-tt $MGB-formation-modifier-01$#! \n or \n• Obtiene #tooltippable;tooltip:[GetPlayer.GetTooltipTag],MGB-modifier-effect-tt-2 $MGB-formation-modifier-02$#!" 
